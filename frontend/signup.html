<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sign Up | Admission Turkey</title>

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="auth-body">

<div style="position: absolute; top: 15px; right: 20px; display: flex; gap: 10px; z-index: 100;">
  <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Theme">
    <i class="fas fa-moon"></i>
  </button>
  <div class="lang-selector">
    <button id="langDropdownBtn" class="lang-dropdown-btn" aria-label="Select Language">
      <i class="fas fa-globe"></i>
      <span id="currentLangLabel">EN</span>
      <i class="fas fa-chevron-down"></i>
    </button>
    <div class="lang-dropdown-menu">
      <button data-lang="en" class="lang-option active">English (EN)</button>
      <button data-lang="tr" class="lang-option">Türkçe (TR)</button>
      <button data-lang="ar" class="lang-option">العربية (AR)</button>
    </div>
  </div>
</div>

<div class="auth-box reveal-scale">


<img src="images/logo.png"
class="auth-logo">


<h2>
Create Your Account
</h2>

<p>
Join Admission Turkey today.
</p>


<form id="signupForm">


<input
type="text"
placeholder="Full Name"
required
>


<input
type="email"
placeholder="Email Address"
required
>


<input
type="tel"
placeholder="Phone Number"
required
>


<input
type="password"
placeholder="Password"
required
>


<input
type="password"
placeholder="Confirm Password"
required
>


<button
type="submit"
class="primary-btn full-btn">

Create Account

</button>


</form>


<p class="auth-link">

Already have an account?

<a href="login.html">

Login

</a>

</p>


<a href="index.html">

← Back to Home

</a>


</div>


<script src="js/script.js?v=2"></script>
</body>

</html>
