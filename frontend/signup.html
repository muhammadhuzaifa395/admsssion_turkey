<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sign Up | Admission Turkey</title>

<link rel="stylesheet"
href="css/style.css">

</head>


<body class="auth-body">


<div class="auth-box">


<img src="images/logo.png"
class="auth-logo">


<h2>
Create Your Account
</h2>

<p>
Join Admission Turkey today.
</p>


<form id="signupForm">


<input
type="text"
placeholder="Full Name"
required
>


<input
type="email"
placeholder="Email Address"
required
>


<input
type="tel"
placeholder="Phone Number"
required
>


<input
type="password"
placeholder="Password"
required
>


<input
type="password"
placeholder="Confirm Password"
required
>


<button
type="submit"
class="primary-btn full-btn">

Create Account

</button>


</form>


<p class="auth-link">

Already have an account?

<a href="login.html">

Login

</a>

</p>


<a href="index.html">

← Back to Home

</a>


</div>


<script src="js/script.js?v=2"></script>
</body>

</html>
